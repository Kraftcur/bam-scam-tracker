name = "bam-scam-tracker-ingest"
main = "workers/scheduled-ingest.ts"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "bam_scam_tracker"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "bam-scam-tracker-archive"

[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"

[triggers]
crons = ["0 */6 * * *"]
