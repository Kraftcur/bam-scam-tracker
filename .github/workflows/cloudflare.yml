name: Cloudflare Verify And Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare after verification"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - codex/evidence-explorer

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Production dependency audit
        run: npm audit --omit=dev

  deploy:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Patch Cloudflare binding IDs
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          test -n "$CF_D1_DATABASE_ID"
          test -n "$CF_KV_NAMESPACE_ID"
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          for (const file of ["wrangler.toml", "wrangler.ingest.toml"]) {
            let text = readFileSync(file, "utf8");
            text = text.replace(/database_id = "([^"]+)"/, `database_id = "${process.env.CF_D1_DATABASE_ID}"`);
            text = text.replace(/id = "([^"]+)"/, `id = "${process.env.CF_KV_NAMESPACE_ID}"`);
            writeFileSync(file, text);
          }
          NODE

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Seed D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:seed:remote

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy -- --project-name=bam-scam-tracker --branch=${{ github.ref_name }}

      - name: Deploy ingest worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:ingest
